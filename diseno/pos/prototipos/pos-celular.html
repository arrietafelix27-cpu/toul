<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOUL · POS celular</title>

<style>
body{margin:0}
a{color:#32d74b}a:hover{color:#7ee89a}
.tc *{box-sizing:border-box}
.tc button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
.tc input{font-family:inherit}
.press{transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 200ms,opacity 200ms}
.press:active{transform:scale(.94)}
.fab{transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.fab:active{transform:scale(.9)}

/* Apertura líquida (aprobada) */
.lobes{position:absolute;inset:0;z-index:4;pointer-events:none;filter:url(#pos-goo)}
.lobe{position:absolute;left:calc(195px - var(--s) / 2);top:calc(792px - var(--s) / 2);width:var(--s);height:var(--s);border-radius:50%;opacity:0;background-color:#28b73f;will-change:transform;transform:translate(0px,0px) scale(var(--z));
transition:transform calc(var(--d) * var(--k) * .9) cubic-bezier(.55,0,.45,1) calc(var(--d) * var(--w) * .6),opacity 60ms linear calc(var(--d) * .92)}
.open .lobe{opacity:1;transform:translate(var(--x),var(--y)) scale(1);transition:transform calc(var(--d) * var(--k)) cubic-bezier(.23,1,.32,1) calc(var(--d) * var(--w)),opacity 40ms linear}
.caja{position:absolute;inset:0;z-index:6;background:#0a0a0a;opacity:0;pointer-events:none;overflow:hidden;transition:opacity 120ms linear}
.open .caja{opacity:1;pointer-events:auto;transition:opacity 180ms ease calc(var(--d) * .55)}

/* Inicio */
.fresh{animation:fresh 2.4s cubic-bezier(.23,1,.32,1) both}
@keyframes fresh{0%{opacity:0;transform:translateY(6px) scale(.9)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* Capas de la caja */
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:#0a0a0a;transition:transform 440ms cubic-bezier(.32,.72,0,1),opacity 300ms ease,filter 300ms ease}
.posL.push{transform:translateX(-24%) scale(.98);opacity:.35;pointer-events:none}
.payL{transform:translateX(100%);box-shadow:-20px 0 60px rgba(0,0,0,.6)}
.payL.in{transform:none}
.payL.gone{transform:scale(.94);opacity:0;pointer-events:none}
.doneL{opacity:0;pointer-events:none;transform:scale(1.04);transition:opacity 260ms ease,transform 420ms cubic-bezier(.23,1,.32,1)}
.doneL.in{opacity:1;pointer-events:auto;transform:none}

/* Buscador + filtrar/ordenar */
.ibtn{position:relative;width:50px;height:50px;flex-shrink:0;border-radius:16px;border:none;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 220ms,color 220ms}
.ibtn:active{transform:scale(.9)}
.ibtn.on{background:rgba(50,215,75,.12);box-shadow:inset 0 0 0 1px rgba(50,215,75,.45);color:#32d74b}
.ibtn .badge{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:#32d74b;box-shadow:0 0 0 2px #0a0a0a;animation:ck 320ms cubic-bezier(.34,1.56,.64,1) both}
.pop{position:absolute;top:128px;right:20px;z-index:12;width:236px;padding:6px;border-radius:20px;background:rgba(30,32,30,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 24px 50px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08);transform-origin:90% 0%;opacity:0;transform:scale(.86) translateY(-6px);pointer-events:none;transition:opacity 200ms ease,transform 300ms cubic-bezier(.34,1.3,.64,1)}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.popt{padding:8px 12px 6px;font-size:12px;color:rgba(255,255,255,.45)}
.opt{width:100%;height:44px;padding:0 12px;border:none;border-radius:14px;background:transparent;color:#ffffff;font-size:15px;display:flex;align-items:center;justify-content:space-between;transition:background-color 180ms,transform 160ms cubic-bezier(.23,1,.32,1)}
.opt:active{transform:scale(.97);background:rgba(255,255,255,.08)}
.opt.on{background:rgba(255,255,255,.06)}
.scrim{position:absolute;inset:0;z-index:11;background:rgba(0,0,0,0);pointer-events:none;transition:background-color 240ms}
.scrim.on{background:rgba(0,0,0,.35);pointer-events:auto}

/* Categorías en círculo */
.cats{display:flex;gap:16px;padding:6px 20px 4px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;width:68px;padding:0;border:none;background:transparent;color:rgba(255,255,255,.45);font-size:13px;transition:color 260ms ease}
.cat.on{color:#ffffff;font-weight:600}
.circ{position:relative;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);font-size:22px;font-weight:700;transition:transform 300ms cubic-bezier(.34,1.56,.64,1)}
.cat:active .circ{transform:scale(.88)}
.circ::after{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:inset 0 0 0 2.5px #ffffff;opacity:0;transform:scale(.8);transition:opacity 240ms ease,transform 360ms cubic-bezier(.34,1.56,.64,1)}
.cat.on .circ::after{opacity:1;transform:none}
.cat.on .circ{transform:scale(.92)}
.clbl{max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Lista con profundidad */
.plist{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 120px;scrollbar-width:none;overscroll-behavior:contain;scroll-behavior:smooth}
.plist::-webkit-scrollbar{display:none}
.prow{opacity:0;transform:translateY(14px)}
.open .prow{animation:pin 360ms cubic-bezier(.23,1,.32,1) both;animation-delay:calc(var(--d) * .6 + var(--i) * 34ms)}
@keyframes pin{to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
.depth{animation:depth linear both;animation-timeline:view();animation-range:exit-crossing 10% exit-crossing 100%;transform-origin:50% 0%}
@keyframes depth{to{transform:scale(.9) translateY(10px);opacity:0;filter:blur(2px)}}
}
.tile{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%)}
.addb{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:#ffffff;display:flex;align-items:center;justify-content:center;transition:transform 180ms cubic-bezier(.23,1,.32,1),background-color 200ms}
.addb:active{transform:scale(.86);background:rgba(50,215,75,.3)}
.step{display:flex;align-items:center;height:42px;padding:0 4px;border-radius:99px;background:rgba(50,215,75,.12);box-shadow:inset 0 0 0 1px rgba(50,215,75,.38);transform-origin:100% 50%;animation:grow 420ms cubic-bezier(.34,1.56,.64,1) both}
@keyframes grow{from{transform:scaleX(.36);opacity:.4}to{transform:none;opacity:1}}
.sb{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:#7ee89a;display:flex;align-items:center;justify-content:center;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms}
.sb:active{transform:scale(.8);background:rgba(50,215,75,.22)}
.sb.del{color:#ff453a;background:rgba(255,69,58,.14)}
.sb.del:active{background:rgba(255,69,58,.3)}
.sb.del svg{animation:wig 420ms cubic-bezier(.34,1.56,.64,1)}
@keyframes wig{0%{transform:scale(.4) rotate(-20deg)}60%{transform:scale(1.1) rotate(6deg)}100%{transform:none}}
.mini2{display:inline-flex;height:30px;padding:3px;border-radius:10px;background:rgba(255,255,255,.07);position:relative}
.mini2 .k{position:absolute;top:3px;bottom:3px;left:3px;width:30px;border-radius:8px;background:#ffffff;transition:transform 320ms cubic-bezier(.34,1.3,.64,1)}
.mini2.r .k{transform:translateX(30px)}
.mini2 button{position:relative;z-index:1;width:30px;border:none;background:transparent;color:rgba(255,255,255,.6);font-size:14px;font-weight:700;transition:color 220ms}
.mini2 button.on{color:#0a0a0a}
.field{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;border-radius:16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:box-shadow 220ms}
.field:focus-within{box-shadow:inset 0 0 0 1.5px rgba(50,215,75,.55)}
.field input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:#ffffff;font-size:16px}
.crow{width:100%;height:52px;padding:0 12px;border:none;border-radius:14px;background:transparent;color:#ffffff;font-size:15px;display:flex;align-items:center;gap:12px;text-align:left;transition:background-color 180ms,transform 160ms cubic-bezier(.23,1,.32,1)}
.crow:active{transform:scale(.98);background:rgba(255,255,255,.06)}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.picked{display:flex;align-items:center;gap:12px;height:60px;padding:0 8px 0 12px;border-radius:18px;background:rgba(50,215,75,.08);box-shadow:inset 0 0 0 1.5px rgba(50,215,75,.45);animation:grow2 420ms cubic-bezier(.34,1.4,.64,1) both}
@keyframes grow2{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.qty{width:40px;height:34px;border:none;outline:none;background:transparent;text-align:center;color:#ffffff;font-size:17px;font-weight:700;border-radius:10px;caret-color:#32d74b;transition:background-color 200ms,box-shadow 200ms}
.qty:focus{background:rgba(0,0,0,.35);box-shadow:0 0 0 1px rgba(50,215,75,.6)}
.bA{animation:bA 300ms cubic-bezier(.34,1.56,.64,1)}.bB{animation:bB 300ms cubic-bezier(.34,1.56,.64,1)}
@keyframes bA{40%{transform:scale(1.28)}}@keyframes bB{40%{transform:scale(1.28)}}

/* Barra del carrito */
.cart{position:absolute;left:14px;right:14px;bottom:18px;height:70px;border-radius:24px;display:flex;align-items:center;gap:12px;padding:0 8px 0 14px;background:rgba(28,30,28,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08);transform:translateY(140%);transition:transform 520ms cubic-bezier(.34,1.4,.64,1)}
.cart.show{transform:none}
.cA{animation:cA 340ms cubic-bezier(.34,1.56,.64,1)}.cB{animation:cB 340ms cubic-bezier(.34,1.56,.64,1)}
@keyframes cA{40%{transform:scale(1.06)}}@keyframes cB{40%{transform:scale(1.06)}}
.mini{width:30px;height:30px;border-radius:10px;border:2px solid #1c1e1c;margin-left:-10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.mini:first-child{margin-left:0}
.go{height:54px;padding:0 20px;border:none;border-radius:18px;background:#32d74b;color:#06210c;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(50,215,75,.35);transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.go:active{transform:scale(.95)}
.go svg{transition:transform 260ms cubic-bezier(.23,1,.32,1)}
.go:active svg{transform:translateX(4px)}

/* Pago */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;background:rgba(255,255,255,.06)}
.segpill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:#ffffff;box-shadow:0 4px 16px rgba(255,255,255,.14);transition:transform 380ms cubic-bezier(.34,1.3,.64,1)}
.seg.r .segpill{transform:translateX(100%)}
.segb{position:relative;z-index:1;height:44px;border:none;background:transparent;color:rgba(255,255,255,.6);font-size:15px;font-weight:500;transition:color 260ms}
.segb.on{color:#0a0a0a;font-weight:700}
.meth{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;border-radius:16px;border:none;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);color:#ffffff;font-size:15px;text-align:left;transition:background-color 220ms,box-shadow 220ms,transform 160ms cubic-bezier(.23,1,.32,1)}
.meth:active{transform:scale(.96)}
.meth.on{background:rgba(50,215,75,.1);box-shadow:inset 0 0 0 1.5px rgba(50,215,75,.6)}
.mck{margin-left:auto;width:20px;height:20px;border-radius:50%;background:#32d74b;color:#06210c;display:flex;align-items:center;justify-content:center;animation:ck 360ms cubic-bezier(.34,1.56,.64,1) both}
@keyframes ck{from{transform:scale(0)}to{transform:none}}
.chip{height:38px;padding:0 14px;border-radius:99px;border:none;background:rgba(255,255,255,.06);color:rgba(255,255,255,.75);font-size:14px;transition:background-color 220ms,color 220ms,transform 160ms cubic-bezier(.23,1,.32,1)}
.chip:active{transform:scale(.94)}
.chip.on{background:#ffffff;color:#0a0a0a;font-weight:600}
.reveal{animation:reveal 380ms cubic-bezier(.23,1,.32,1) both}
@keyframes reveal{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.confirm{position:relative;height:58px;width:100%;margin:0 auto;border:none;border-radius:20px;background:#32d74b;color:#06210c;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:visible;box-shadow:0 10px 26px rgba(50,215,75,.32);transition:width 420ms cubic-bezier(.65,0,.35,1),border-radius 420ms cubic-bezier(.65,0,.35,1),transform 160ms cubic-bezier(.23,1,.32,1),opacity 200ms}
.confirm:active{transform:scale(.97)}
.confirm:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);box-shadow:none;transition:background-color 300ms,color 300ms}
.confirm .lbl{transition:opacity 160ms}
.confirm.ld{width:58px;border-radius:29px}
.confirm.ld .lbl,.confirm.bs .lbl{opacity:0}
.confirm.bs{width:58px;border-radius:29px;animation:boom 360ms cubic-bezier(.23,1,.32,1) forwards}
@keyframes boom{50%{transform:scale(1.18)}100%{transform:scale(.2);opacity:0}}
.dots{position:absolute;display:flex;gap:5px;opacity:0;transition:opacity 160ms}
.ld .dots{opacity:1}
.dots i{width:6px;height:6px;border-radius:50%;background:#06210c;animation:dot 900ms ease-in-out infinite}
.dots i:nth-child(2){animation-delay:120ms}.dots i:nth-child(3){animation-delay:240ms}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:2px;background:var(--c);opacity:0}
.bs .spark{animation:spark 520ms cubic-bezier(.2,.7,.2,1) both}
@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-60px) scale(.4)}}

/* Logro */
.glow{position:absolute;left:50%;top:150px;width:520px;height:520px;margin-left:-260px;border-radius:50%;background:radial-gradient(closest-side,rgba(50,215,75,.22),rgba(50,215,75,0));opacity:0}
.in .glow{animation:glow 1.6s ease-out both}
@keyframes glow{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{opacity:.55;transform:scale(1)}}
.ring{position:relative;width:96px;height:96px;border-radius:50%;background:#32d74b;display:flex;align-items:center;justify-content:center;color:#06210c;transform:scale(0)}
.in .ring{animation:ringIn 620ms cubic-bezier(.34,1.56,.64,1) 80ms both}
@keyframes ringIn{0%{transform:scale(0)}100%{transform:scale(1)}}
.ring::before{content:"";position:absolute;inset:-10px;border-radius:50%;box-shadow:0 0 0 2px rgba(50,215,75,.5);opacity:0}
.in .ring::before{animation:pulse 900ms ease-out 380ms both}
@keyframes pulse{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.5)}}
.ckp{stroke-dasharray:40;stroke-dashoffset:40}
.in .ckp{animation:draw 420ms cubic-bezier(.65,0,.35,1) 420ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cf{position:absolute;left:50%;top:50%;width:8px;height:12px;margin:-6px -4px;border-radius:3px;background:var(--c);opacity:0}
.in .cf{animation:cf 1100ms cubic-bezier(.15,.7,.25,1) var(--dl) both}
@keyframes cf{0%{opacity:0;transform:rotate(var(--a)) translateY(0) rotate(0deg)}10%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--r) * -1)) rotate(260deg)}}
.up{opacity:0;transform:translateY(12px)}
.in .up{animation:pin 520ms cubic-bezier(.23,1,.32,1) both;animation-delay:var(--dl)}
.btn2{height:54px;border:none;border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:#ffffff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 200ms}
.btn2:active{transform:scale(.96)}

/* Comprobante */
.rsheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(0,0,0,0);pointer-events:none;transition:background-color 300ms}
.rsheet.on{background:rgba(0,0,0,.6);pointer-events:auto}
.rpanel{width:100%;padding:12px 18px 26px;border-radius:28px 28px 0 0;background:#151715;transform:translateY(100%);transition:transform 460ms cubic-bezier(.32,.72,0,1)}
.rsheet.on .rpanel{transform:none}
.paper{background:#ffffff;color:#121412;border-radius:18px;padding:20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-1.5deg) translateY(20px);opacity:0}
.rsheet.on .paper{animation:paper 560ms cubic-bezier(.34,1.3,.64,1) 160ms forwards}
@keyframes paper{to{transform:rotate(0deg) translateY(0);opacity:1}}
.toast{position:absolute;left:50%;bottom:30px;z-index:30;transform:translateX(-50%);padding:10px 16px;border-radius:99px;background:rgba(32,34,32,.92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:13px;white-space:nowrap;display:flex;gap:6px;align-items:center;animation:toast 2.2s ease both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}


/* Presentaciones y combos */
.tbadge{position:absolute;right:4px;bottom:4px;z-index:1;width:18px;height:18px;border-radius:6px;background:rgba(10,10,10,.7);color:#ffffff;display:flex;align-items:center;justify-content:center}
.tag{flex-shrink:0;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-size:11px;font-weight:600}
.vbtn{height:42px;min-width:42px;padding:0 10px;border:none;border-radius:99px;background:rgba(255,255,255,.08);color:#ffffff;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform 180ms cubic-bezier(.23,1,.32,1),background-color 240ms,box-shadow 240ms}
.vbtn:active{transform:scale(.88)}
.vbtn.on{background:rgba(255,255,255,.12)}
.vbtn.has{background:rgba(50,215,75,.12);box-shadow:inset 0 0 0 1px rgba(50,215,75,.38);color:#7ee89a}
.vbtn .chev{transition:transform 380ms cubic-bezier(.34,1.3,.64,1)}
.vbtn.on .chev{transform:rotate(180deg)}
.vn{min-width:18px;font-size:15px;font-weight:700;color:#ffffff}
.vx{display:grid;grid-template-rows:0fr;transition:grid-template-rows 420ms cubic-bezier(.23,1,.32,1)}
.vx.on{grid-template-rows:1fr}
.vlist{margin:0 0 8px 72px;padding-left:14px;border-left:1px solid rgba(255,255,255,.08)}
.vrow{display:flex;align-items:center;gap:12px;padding:8px 0;opacity:0;transform:translateY(-6px);transition:opacity 220ms ease,transform 320ms cubic-bezier(.23,1,.32,1)}
.vx.on .vrow{opacity:1;transform:none;transition-delay:calc(var(--j) * 50ms + 80ms)}
.outb{width:42px;height:42px;border-radius:50%;background:rgba(255,69,58,.1);color:#ff453a;display:flex;align-items:center;justify-content:center}

/* Clientes */
.clist{max-height:262px;overflow-y:auto;margin-top:6px;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);padding-bottom:20px}
.clist::-webkit-scrollbar{display:none}
.crow{animation:reveal 300ms cubic-bezier(.23,1,.32,1) both;animation-delay:calc(var(--k) * 25ms)}
.addcl{display:flex;align-items:center;gap:12px;width:100%;height:56px;padding:0 14px;border:none;border-radius:16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);color:#ffffff;font-size:15px;text-align:left;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 200ms}
.addcl:active{transform:scale(.97)}
.warn{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:14px;background:rgba(255,179,64,.1);color:#ffcf85;font-size:13px;line-height:1.4}

/* Calendario */
.cal{margin-top:10px;padding:12px;border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.calh{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px}
.calnav{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.07);color:#ffffff;display:flex;align-items:center;justify-content:center;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.calnav:active{transform:scale(.86)}
.calnav:disabled{opacity:.25}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.calw{font-size:11px;color:rgba(255,255,255,.4);padding:4px 0}
