<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diseño · Caja</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
body{margin:0;background:#000;font-family:system-ui,-apple-system,sans-serif;padding:24px 12px}
.tg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.tg button{font-size:12px;padding:6px 11px;border-radius:8px;border:1px solid #333;background:transparent;color:#999;cursor:pointer}
.tg button.on{background:#222;color:#fff}
.sp{width:1px;background:#333;margin:0 3px}
.ui{color:#fff;font-variant-numeric:tabular-nums;background:#0a0a0a;border:6px solid #1a1a1a;margin:0 auto;position:relative;overflow:hidden}
.pc{max-width:860px;border-radius:16px;height:660px;display:flex;flex-direction:column}
.ph{width:340px;max-width:100%;border-radius:38px;height:700px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.tabs{display:flex;background:rgba(255,255,255,.06);border-radius:11px;padding:3px;position:relative}
.tabs div{position:relative;z-index:1;font-size:13px;padding:6px 12px;color:rgba(255,255,255,.55);white-space:nowrap}
.tabs div.on{color:#fff;font-weight:600}
.tabs i.ind{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:9px;background:rgba(255,255,255,.12)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.65);background:rgba(255,255,255,.06);border-radius:99px;padding:5px 10px;white-space:nowrap}
.dotg{width:7px;height:7px;border-radius:50%}
.av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:0}
.lp{padding:16px 20px;overflow:auto;scrollbar-width:none}
.rp{border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;min-height:0}
.sr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:13px;padding:10px 14px;font-size:14px;color:rgba(255,255,255,.4)}
.kb{margin-left:auto;font-size:11px;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:1px 6px}
.cats{display:flex;gap:14px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.ct{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;flex-shrink:0}
.cc{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.12),rgba(255,255,255,.04) 70%);border:2px solid transparent;transition:border-color .25s,transform .15s}
.ct.on{color:#fff}.ct.on .cc{border-color:#fff}.ct:active .cc{transform:scale(.92)}
.sec{font-size:15px;font-weight:700;margin:16px 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pk{cursor:pointer;transition:transform .18s cubic-bezier(.23,1,.32,1)}
.pk:active{transform:scale(.95)}
.pi{aspect-ratio:1/1;border-radius:16px;position:relative;overflow:hidden}
.tag{position:absolute;left:8px;top:8px;font-size:10px;font-weight:600;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:99px;padding:3px 8px}
.q{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:99px;background:#32d74b;color:#0a0a0a;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 7px;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.pn{font-size:13px;font-weight:500;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp{font-size:13px;font-weight:600;margin-top:2px}
.ps{font-weight:400;color:rgba(255,255,255,.45);font-size:12px}
.off{opacity:.32;pointer-events:none}
.fu{opacity:0;transform:translateY(8px);animation:fu .45s cubic-bezier(.23,1,.32,1) forwards}
@keyframes fu{to{opacity:1;transform:none}}
.pane{flex:1;overflow:auto;padding:16px 18px 8px;scrollbar-width:none}
.pt{font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.pt span{font-size:12px;color:rgba(255,255,255,.45);font-weight:400}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.nl{animation:sl .4s cubic-bezier(.23,1,.32,1)}
@keyframes sl{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.lt{width:36px;height:36px;border-radius:10px;flex-shrink:0}
.stp{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.stp button{width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.stp button:disabled{opacity:.3}
.lk{font-size:13px;color:rgba(255,255,255,.55);margin-top:10px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.lb{font-size:12px;color:rgba(255,255,255,.45);margin:16px 0 8px;display:flex;justify-content:space-between}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.06);border-radius:11px;padding:3px;position:relative}
.seg div{position:relative;z-index:1;text-align:center;padding:8px;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;transition:color .2s}
.seg div.on{color:#fff;font-weight:600}
.seg div.dis{opacity:.3;pointer-events:none}
.seg i{position:absolute;z-index:0;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:9px;background:rgba(255,255,255,.14);transition:transform .35s cubic-bezier(.23,1,.32,1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid transparent;cursor:pointer;color:rgba(255,255,255,.7);transition:all .2s}
.chip.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45);color:#fff}
.inp{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid transparent;border-radius:11px;padding:9px 12px;color:#fff;font-size:14px;font-family:inherit;outline:none}
.inp:focus{border-color:rgba(255,255,255,.35)}
.dd{background:#1c1c1e;border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-top:6px;overflow:hidden}
.dd div{padding:9px 12px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between}
.dd div:hover{background:rgba(255,255,255,.06)}
.ml{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.ml .inp{width:120px;padding:6px 10px;text-align:right}
.vu{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:13px;color:rgba(255,255,255,.55)}
.vu b{font-size:19px;color:#fff;letter-spacing:-.4px}
.amber{color:#ffd60a}
.ft{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.06)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tot b{font-size:28px;font-weight:700;letter-spacing:-1px}
.cta{width:100%;height:50px;border-radius:14px;border:none;background:#32d74b;color:#0a0a0a;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.3;cursor:default}
.cta.w{background:rgba(255,255,255,.1);color:#fff}
.why{font-size:12px;color:rgba(255,255,255,.45);text-align:center;margin-top:8px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.25);border-top-color:#0a0a0a;animation:rot .7s linear infinite}
.spin.w{border-color:rgba(255,255,255,.2);border-top-color:#fff}
@keyframes rot{to{transform:rotate(360deg)}}
.ok{flex:1;overflow:auto;padding:22px 20px 10px;text-align:center;scrollbar-width:none}
.ring{position:relative;width:84px;height:84px;margin:0 auto}
.ring:before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(50,215,75,.25);animation:rp 1.4s ease-out .3s 2}
@keyframes rp{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
.ck{stroke-dasharray:60;stroke-dashoffset:60;animation:ckd .55s .15s cubic-bezier(.65,0,.35,1) forwards}
@keyframes ckd{to{stroke-dashoffset:0}}
.sm{font-size:13px;text-align:left;margin-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.sm div{display:flex;justify-content:space-between;padding:7px 0;color:rgba(255,255,255,.6)}
.sm b{color:#fff;font-weight:600}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:13px;background:rgba(255,255,255,.08);font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.undo{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.6);padding:11px 18px;border-top:1px solid rgba(255,255,255,.06);position:relative}
.undo b{color:#fff;cursor:pointer}
.bar{position:absolute;left:0;bottom:0;height:2px;background:#32d74b;animation:sh 5s linear forwards}
@keyframes sh{from{width:100%}to{width:0}}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{background:#141414;border-radius:24px 24px 0 0;width:100%;max-width:420px;padding:18px;animation:up .4s cubic-bezier(.32,.72,0,1)}
.pc .ov{align-items:center}.pc .sh{border-radius:20px;max-width:380px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.mrow{display:flex;align-items:center;gap:12px;padding:9px 0}
.mi{width:54px;height:54px;border-radius:14px;flex-shrink:0;position:relative}
.add{margin-left:auto;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.bot{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:12px}
.full{position:absolute;inset:0;background:#0d0d0d;display:flex;flex-direction:column;animation:up .4s cubic-bezier(.32,.72,0,1);z-index:4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fu{opacity:1;transform:none}.ck{stroke-dashoffset:0}}
</style></head><body>
<div class="tg"><button id="d1" class="on" onclick="set('dev',1)">PC</button><button id="d2" onclick="set('dev',2)">Celular</button><span class="sp"></span><button id="r1" class="on" onclick="set('role','admin')">Administrador</button><button id="r2" onclick="set('role','vend')">Vendedor</button><span class="sp"></span><button id="o1" class="on" onclick="set('on',true)">Con internet</button><button id="o2" onclick="set('on',false)">Sin internet</button></div>
<div id="w"></div>
<script src="caja.js"></script>
</body></html>
